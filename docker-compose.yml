version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trend-contenter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trend_contenter
      POSTGRES_USER: trend_user
      POSTGRES_PASSWORD: trend_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trend_user -d trend_contenter"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: trend-contenter-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8080"
    environment:
      - APP_ENV=production
      - PORT=8080
      - POSTGRES_URI=postgresql+asyncpg://trend_user:trend_password@postgres:5432/trend_contenter
      - TRENDS_PROVIDER=serpapi
      - LLM_PROVIDER=openai
      - TRENDS_GEO=IN
      - TREND_QUALIFICATION_THRESHOLD=0.70
      - SERPAPI_API_KEY=${SERPAPI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_BASE_URL=${GEMINI_BASE_URL}
      - LLM_GATEWAY_BASE_URL=${LLM_GATEWAY_BASE_URL}
      - LLM_GATEWAY_TOKEN=${LLM_GATEWAY_TOKEN}
      - GEMINI_IMAGE_MODEL=${GEMINI_IMAGE_MODEL:-gemini-3.1-pro-image}
      - GEMINI_IMAGE_EDIT_MODEL=${GEMINI_IMAGE_EDIT_MODEL:-gemini-3.1-pro-image}
      - GEMINI_VIDEO_MODEL=${GEMINI_VIDEO_MODEL:-gemini-omni-1.1-flash}
      - VEO_MODEL=${VEO_MODEL:-veo-2.0-generate-001}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-supersecretkey_production}
    env_file:
      - .env
    volumes:
      - ./apps/api/app:/app/apps/api/app

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    container_name: trend-contenter-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:8080"
    environment:
      - PORT=8080
    volumes:
      - ./apps/web/dist:/usr/share/nginx/html

volumes:
  pgdata:
