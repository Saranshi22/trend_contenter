[project]
name = "trend-contenter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "google-genai>=2.29.0",
    "googlesearch-python>=1.3.0",
    "gunicorn>=26.2.0",
    "httpx2>=2.13.1",
    "jinja2>=3.1.6",
    "langchain>=1.4.4",
    "langchain-google-genai>=4.4.1",
    "mcp>=2.3.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "sentence-transformers[image]>=6.1.0",
    "serpapi>=1.1.2",
    "torch>=2.2",
    "torchvision",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
