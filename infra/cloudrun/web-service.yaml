apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: trend-contenter-web
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
    spec:
      containerConcurrency: 100
      timeoutSeconds: 60
      containers:
        - image: LOCATION-docker.pkg.dev/PROJECT_ID/trend-contenter-repo/web:latest
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          ports:
            - containerPort: 8080
