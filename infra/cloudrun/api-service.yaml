apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: trend-contenter-api
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: LOCATION-docker.pkg.dev/PROJECT_ID/trend-contenter-repo/api:latest
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: "production"
            - name: TRENDS_PROVIDER
              value: "serpapi"
            - name: LLM_PROVIDER
              value: "openai"
            - name: TRENDS_GEO
              value: "IN"
            - name: TRENDS_HOURS
              value: "4"
            - name: TRENDS_LANGUAGE
              value: "en"
            - name: TRENDS_POLL_INTERVAL_MINUTES
              value: "60"
            - name: TREND_QUALIFICATION_THRESHOLD
              value: "0.70"
            - name: GCS_BUCKET
              value: "trend-contenter-media-project-887f831b-8f15-4ffd-a4d"
            - name: USE_LLM_GATEWAY_FOR_CONTENT_STUDIO
              value: "true"
            - name: LLM_GATEWAY_BASE_URL
              value: "https://bodhi-llm-gateway.dev.psbodhi.live"
            - name: GEMINI_TEXT_MODEL
              value: "gemini-3.8-flash"
            - name: GEMINI_EMBEDDING_MODEL
              value: "gemini-embedding-001"
            - name: GEMINI_IMAGE_MODEL
              value: "gemini-3.1-flash-image"
            - name: GEMINI_IMAGE_EDIT_MODEL
              value: "gemini-3.1-flash-image"
            - name: VEO_MODEL
              value: "veo-3.1-fast-generate-preview"
            - name: OPENAI_TEXT_MODEL
              value: "gpt-4o-mini"
            - name: LLM_PROBE_MAX_QUERIES
              value: "4"
            - name: LLM_REQUEST_TIMEOUT_SECONDS
              value: "30"
            - name: POSTGRES_URI
              valueFrom:
                secretKeyRef:
                  name: postgres-uri
                  key: latest
            - name: SERPAPI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: serpapi-key
                  key: latest
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-key
                  key: latest
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-key
                  key: latest
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: latest
            - name: SOCIALCRAWL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: socialcrawl-key
                  key: latest
            - name: YOUTUBE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: youtube-key
                  key: latest
