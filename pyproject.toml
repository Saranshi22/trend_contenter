[tool.poetry]
package-mode = false
name = "trend-contenter"
version = "0.1.0"
description = "AI-powered content intelligence platform"
authors = ["Saranshi <saranshisinghai@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = "^2.7.0"
pydantic-settings = "^2.2.1"
motor = "^3.4.0" # MongoDB async driver
httpx = "^0.27.0"
langgraph = "^0.0.65"
google-genai = "^0.5.0"
sqlalchemy = "^2.1.4"
asyncpg = "^0.32.0"
openai = "^3.27.0"
python-dotenv = "^1.2.4"
pyjwt = "^2.15.1"
passlib = "^1.7.4"
bcrypt = "^5.0.0"
python-multipart = "^0.0.32"
greenlet = "^3.5.6"
apscheduler = "^3.11.3"
reportlab = "^5.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
